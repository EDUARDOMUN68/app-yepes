name: Actualizar noticias y redes municipales
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: municipal-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: municipal
        continue-on-error: true
        run: node scripts/update-news.mjs
      - id: instagram
        continue-on-error: true
        run: node scripts/update-social.mjs
      - name: Guardar titulares
        run: |
          if ! git diff --quiet -- news.json news-social.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add news.json news-social.json
            git commit -m 'Actualiza noticias y redes municipales'
            git push
          fi
      - name: Publicar datos actualizados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds"
      - name: Informar fallos de fuentes
        if: steps.municipal.outcome == 'failure' || steps.instagram.outcome == 'failure'
        run: |
          echo 'Una fuente no se ha podido consultar. Se conserva su última información y se muestra el estado en la app.'
          exit 1

