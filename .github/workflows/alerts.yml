name: Actualizar avisos oficiales AEMET
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: municipal-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: aemet
        continue-on-error: true
        run: python scripts/update-alerts.py
      - name: Guardar avisos y estado de la fuente
        run: |
          if ! git diff --quiet -- alerts.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add alerts.json
            git commit -m 'Actualiza avisos oficiales AEMET'
            git pull --rebase origin main
            git push
          fi
      - name: Publicar datos actualizados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds"
      - name: Informar fallo de consulta
        if: steps.aemet.outcome == 'failure'
        run: exit 1
